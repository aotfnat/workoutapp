<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fitness App PWA</title>

    <link rel="stylesheet" href="./styles.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4CAF50">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fitness App">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
</head>
<body>
<div id="app">
    <main class="content-area">
        <!-- CALENDAR -->
        <div id="calendar-section" class="tab-content active">
            <h2>📅 Calendar</h2>
            <div id="calendar-view">
                <p>Upcoming workouts and history will appear here.</p>
            </div>
        </div>

        <!-- PLAN -->
        <div id="plan-section" class="tab-content">
            <h2>📋 Weekly Workout Plan</h2>
            <div id="weekly-plan"></div>
            <button onclick="addDay()">Add Day</button>
            <button onclick="savePlan()">Save Plan</button>
        </div>

        <!-- WORKOUT -->
        <div id="workout-section" class="tab-content">

            <!-- Sticky HUD: elapsed left, rest timer right -->
            <div id="workout-hud">
                <div class="hud-cell">
                    <div class="hud-label">⏱ Elapsed</div>
                    <div id="lapsed-time" class="hud-time">00:00</div>
                </div>
                <div class="hud-cell hud-right">
                    <div class="hud-label">😮‍💨 Rest</div>
                    <div id="timer" class="hud-time">01:00</div>
                </div>
            </div>

            <!-- Day selector -->
            <div class="control-row">
                <label for="day-select">Day</label>
                <select id="day-select" onchange="loadDayWorkout()"></select>
            </div>

            <!-- Rest timer controls -->
            <div id="timer-controls">
                <div class="control-row">
                    <label for="rest-duration-select">Rest duration</label>
                    <select id="rest-duration-select">
                        <option value="30">30s</option>
                        <option value="45">45s</option>
                        <option value="60" selected>60s</option>
                        <option value="90">90s</option>
                        <option value="120">120s</option>
                        <option value="custom">Custom…</option>
                    </select>
                    <input type="number" id="custom-rest-seconds" placeholder="sec" min="10">
                </div>
                <div class="timer-btn-row">
                    <button id="timer-start" onclick="startRestTimer()">▶ Start</button>
                    <button id="timer-stop"  onclick="stopRestTimer()" disabled>⏹ Stop</button>
                    <button id="timer-reset" onclick="resetRestTimer()">↺ Reset</button>
                </div>
            </div>

            <!-- Current exercise -->
            <div id="exercise-list"></div>

            <button class="complete-btn" onclick="completeWorkout()">✅ Complete Workout</button>
        </div>

        <!-- PROGRESS -->
        <div id="progress-section" class="tab-content">
            <h2>📈 Progress Tracking</h2>
            <div id="progress-log"></div>
            <canvas id="progress-chart" width="400" height="250"></canvas>
        </div>
    </main>

    <nav class="bottom-tabs">
        <button class="tab-button active" data-tab="calendar">📅<br><span>Calendar</span></button>
        <button class="tab-button" data-tab="plan">📋<br><span>Plan</span></button>
        <button class="tab-button" data-tab="workout">🏋️<br><span>Workout</span></button>
        <button class="tab-button" data-tab="progress">📈<br><span>Progress</span></button>
    </nav>
</div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="./app.js" defer></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('Service Worker registered'))
            .catch(err => console.log('Service Worker registration failed:', err));
    }
    </script>
</body>
</html>
